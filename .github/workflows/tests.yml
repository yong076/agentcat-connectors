name: Tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.9"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile scripts
        run: python -m py_compile bin/agentcat scripts/install.py scripts/pro_channel_install.py scripts/public_channel_install.py

      - name: Validate connector contract
        run: python -m unittest tests.test_contract tests.test_public_channel_install tests.test_install_ps1

      - name: Run unit tests
        env:
          CODEX_HOME: ""
          CLAUDE_CONFIG_DIR: ""
        run: python -m unittest discover -s tests -p '*test*.py'
